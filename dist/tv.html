": "سورة الصافات", "ayah": 181}, {"text": "وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة الصافات", "ayah": 182}, {"text": "الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 18}, {"text": "وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِنْ قَبْلِ أَنْ يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنْصَرُونَ", "surah": "سورة الزمر", "ayah": 54}, {"text": "يَا قَوْمِ إِنَّمَا هَٰذِهِ الْحَيَاةُ الدُّنْيَا مَتَاعٌ وَإِنَّ الْآخِرَةَ هِيَ دَارُ الْقَرَارِ", "surah": "سورة غافر", "ayah": 39}, {"text": "هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ", "surah": "سورة غافر", "ayah": 65}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا تَتَنَزَّلُ عَلَيْهِمُ الْمَلَائِكَةُ أَلَّا تَخَافُوا وَلَا تَحْزَنُوا وَأَبْشِرُوا بِالْجَنَّةِ الَّتِي كُنْتُمْ تُوعَدُونَ", "surah": "سورة فصلت", "ayah": 30}, {"text": "وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ", "surah": "سورة فصلت", "ayah": 33}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا وَمَا رَبُّكَ بِظَلَّامٍ لِلْعَبِيدِ", "surah": "سورة فصلت", "ayah": 46}, {"text": "فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ جَعَلَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا يَذْرَؤُكُمْ فِيهِ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ", "surah": "سورة الشورى", "ayah": 11}, {"text": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة الشورى", "ayah": 25}, {"text": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ", "surah": "سورة الشورى", "ayah": 30}, {"text": "فَمَا أُوتِيتُمْ مِنْ شَيْءٍ فَمَتَاعُ الْحَيَاةِ الدُّنْيَا وَمَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ لِلَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ", "surah": "سورة الشورى", "ayah": 36}, {"text": "وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللَّهِ إِنَّهُ لَا يُحِبُّ الظَّالِمِينَ", "surah": "سورة الشورى", "ayah": 40}, {"text": "الْأَخِلَّاءُ يَوْمَئِذٍ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ إِلَّا الْمُتَّقِينَ", "surah": "سورة الزخرف", "ayah": 67}, {"text": "مَنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ وَمَنْ أَسَاءَ فَعَلَيْهَا ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ", "surah": "سورة الجاثية", "ayah": 15}, {"text": "إِنَّ الَّذِينَ قَالُوا رَبُّنَا اللَّهُ ثُمَّ اسْتَقَامُوا فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة الأحقاف", "ayah": 13}, {"text": "فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ وَاسْتَغْفِرْ لِذَنْبِكَ وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَاللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْوَاكُمْ", "surah": "سورة محمد", "ayah": 19}, {"text": "يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُمْ مِنْ ذَكَرٍ وَأُنْثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِنْدَ اللَّهِ أَتْقَاكُمْ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ", "surah": "سورة الحجرات", "ayah": 13}, {"text": "مَا يَلْفِظُ مِنْ قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ", "surah": "سورة ق", "ayah": 18}, {"text": "وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ غَيْرَ بَعِيدٍ", "surah": "سورة ق", "ayah": 31}, {"text": "كَانُوا قَلِيلًا مِنَ اللَّيْلِ مَا يَهْجَعُونَ", "surah": "سورة الذاريات", "ayah": 17}, {"text": "وَبِالْأَسْحَارِ هُمْ يَسْتَغْفِرُونَ", "surah": "سورة الذاريات", "ayah": 18}, {"text": "فَفِرُّوا إِلَى اللَّهِ إِنِّي لَكُمْ مِنْهُ نَذِيرٌ مُبِينٌ", "surah": "سورة الذاريات", "ayah": 50}, {"text": "إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ", "surah": "سورة الذاريات", "ayah": 58}, {"text": "كُلُّ مَنْ عَلَيْهَا فَانٍ", "surah": "سورة الرحمن", "ayah": 26}, {"text": "هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ", "surah": "سورة الحديد", "ayah": 3}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنْظُرْ نَفْسٌ مَا قَدَّمَتْ لِغَدٍ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ", "surah": "سورة الحشر", "ayah": 18}, {"text": "وَلَا تَكُونُوا كَالَّذِينَ نَسُوا اللَّهَ فَأَنْسَاهُمْ أَنْفُسَهُمْ أُولَٰئِكَ هُمُ الْفَاسِقُونَ", "surah": "سورة الحشر", "ayah": 19}, {"text": "هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة الحشر", "ayah": 24}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ", "surah": "سورة الصف", "ayah": 2}, {"text": "كَبُرَ مَقْتًا عِنْدَ اللَّهِ أَنْ تَقُولُوا مَا لَا تَفْعَلُونَ", "surah": "سورة الصف", "ayah": 3}, {"text": "فَإِذَا قُضِيَتِ الصَّلَاةُ فَانْتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِنْ فَضْلِ اللَّهِ وَاذْكُرُوا اللَّهَ كَثِيرًا لَعَلَّكُمْ تُفْلِحُونَ", "surah": "سورة الجمعة", "ayah": 10}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَنْ ذِكْرِ اللَّهِ وَمَنْ يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ", "surah": "سورة المنافقون", "ayah": 9}, {"text": "إِنَّمَا أَمْوَالُكُمْ وَأَوْلَادُكُمْ فِتْنَةٌ وَاللَّهُ عِنْدَهُ أَجْرٌ عَظِيمٌ", "surah": "سورة التغابن", "ayah": 15}, {"text": "فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ وَاسْمَعُوا وَأَطِيعُوا وَأَنْفِقُوا خَيْرًا لِأَنْفُسِكُمْ وَمَنْ يُوقَ شُحَّ نَفْسِهِ فَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ", "surah": "سورة التغابن", "ayah": 16}, {"text": "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الملك", "ayah": 1}, {"text": "وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ", "surah": "سورة الملك", "ayah": 13}, {"text": "أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ", "surah": "سورة الملك", "ayah": 14}, {"text": "هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ وَإِلَيْهِ النُّشُورُ", "surah": "سورة الملك", "ayah": 15}, {"text": "وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ", "surah": "سورة القلم", "ayah": 4}, {"text": "رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ لَا إِلَٰهَ إِلَّا هُوَ فَاتَّخِذْهُ وَكِيلًا", "surah": "سورة المزمل", "ayah": 9}, {"text": "وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا", "surah": "سورة الإنسان", "ayah": 8}, {"text": "وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا", "surah": "سورة النبإ", "ayah": 9}, {"text": "سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى", "surah": "سورة الأعلى", "ayah": 1}, {"text": "بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا", "surah": "سورة الأعلى", "ayah": 16}, {"text": "أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ", "surah": "سورة الغاشية", "ayah": 17}, {"text": "قَدْ أَفْلَحَ مَنْ زَكَّاهَا", "surah": "سورة الشمس", "ayah": 9}, {"text": "وَقَدْ خَابَ مَنْ دَسَّاهَا", "surah": "سورة الشمس", "ayah": 10}, {"text": "وَلَلْآخِرَةُ خَيْرٌ لَكَ مِنَ الْأُولَىٰ", "surah": "سورة الضحى", "ayah": 4}, {"text": "أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ", "surah": "سورة الشرح", "ayah": 1}, {"text": "فَإِذَا فَرَغْتَ فَانْصَبْ", "surah": "سورة الشرح", "ayah": 7}, {"text": "لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ", "surah": "سورة التين", "ayah": 4}, {"text": "اقْرَأْ وَرَبُّكَ الْأَكْرَمُ", "surah": "سورة العلق", "ayah": 3}, {"text": "لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ", "surah": "سورة القدر", "ayah": 3}, {"text": "وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ", "surah": "سورة الزلزلة", "ayah": 8}, {"text": "أَلْهَاكُمُ التَّكَاثُرُ", "surah": "سورة التكاثر", "ayah": 1}, {"text": "ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ", "surah": "سورة التكاثر", "ayah": 8}, {"text": "إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ", "surah": "سورة العصر", "ayah": 2}, {"text": "فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ", "surah": "سورة قريش", "ayah": 3}, {"text": "اللَّهُ الصَّمَدُ", "surah": "سورة الإخلاص", "ayah": 2}, {"text": "لَمْ يَلِدْ وَلَمْ يُولَدْ", "surah": "سورة الإخلاص", "ayah": 3}, {"text": "وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "surah": "سورة الإخلاص", "ayah": 4}, {"text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ", "surah": "سورة الفلق", "ayah": 1}, {"text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ", "surah": "سورة الناس", "ayah": 1}, {"text": "رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِنْ ذُرِّيَّتِنَا أُمَّةً مُسْلِمَةً لَكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ", "surah": "سورة البقرة", "ayah": 128}, {"text": "وَأَنْفِقُوا فِي سَبِيلِ اللَّهِ وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ", "surah": "سورة البقرة", "ayah": 195}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا ادْخُلُوا فِي السِّلْمِ كَافَّةً وَلَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ إِنَّهُ لَكُمْ عَدُوٌّ مُبِينٌ", "surah": "سورة البقرة", "ayah": 208}, {"text": "أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَأْتِكُمْ مَثَلُ الَّذِينَ خَلَوْا مِنْ قَبْلِكُمْ مَسَّتْهُمُ الْبَأْسَاءُ وَالضَّرَّاءُ وَزُلْزِلُوا حَتَّىٰ يَقُولَ الرَّسُولُ وَالَّذِينَ آمَنُوا مَعَهُ مَتَىٰ نَصْرُ اللَّهِ أَلَا إِنَّ نَصْرَ اللَّهِ قَرِيبٌ", "surah": "سورة البقرة", "ayah": 214}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ وَاللَّهُ غَفُورٌ رَحِيمٌ", "surah": "سورة البقرة", "ayah": 218}, {"text": "مَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ كَمَثَلِ حَبَّةٍ أَنْبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنْبُلَةٍ مِائَةُ حَبَّةٍ وَاللَّهُ يُضَاعِفُ لِمَنْ يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ", "surah": "سورة البقرة", "ayah": 261}, {"text": "الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ ثُمَّ لَا يُتْبِعُونَ مَا أَنْفَقُوا مَنًّا وَلَا أَذًى لَهُمْ أَجْرُهُمْ عِنْدَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ", "surah": "سورة البقرة", "ayah": 262}, {"text": "الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُمْ بِالْفَحْشَاءِ وَاللَّهُ يَعِدُكُمْ مَغْفِرَةً مِنْهُ وَفَضْلًا وَاللَّهُ وَاسِعٌ عَلِيمٌ", "surah": "سورة البقرة", "ayah": 268}, {"text": "إِنْ تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ وَإِنْ تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَكُمْ وَيُكَفِّرُ عَنْكُمْ مِنْ سَيِّئَاتِكُمْ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ", "surah": "سورة البقرة", "ayah": 271}, {"text": "يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ", "surah": "سورة البقرة", "ayah": 276}, {"text": "وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍ مَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ", "surah": "سورة البقرة", "ayah": 281}, {"text": "لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَإِنْ تُبْدُوا مَا فِي أَنْفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُمْ بِهِ اللَّهُ فَيَغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة البقرة", "ayah": 284}, {"text": "لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", "surah": "سورة البقرة", "ayah": 286}, {"text": "شَهِدَ اللَّهُ أَنَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ لَا إِلَٰهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة آل عمران", "ayah": 18}, {"text": "قُلْ إِنْ تُخْفُوا مَا فِي صُدُورِكُمْ أَوْ تُبْدُوهُ يَعْلَمْهُ اللَّهُ وَيَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 29}, {"text": "بَلَىٰ مَنْ أَوْفَىٰ بِعَهْدِهِ وَاتَّقَىٰ فَإِنَّ اللَّهَ يُحِبُّ الْمُتَّقِينَ", "surah": "سورة آل عمران", "ayah": 76}, {"text": "وَمَنْ يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَنْ يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ", "surah": "سورة آل عمران", "ayah": 85}, {"text": "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا وَاذْكُرُوا نِعْمَتَ اللَّهِ عَلَيْكُمْ إِذْ كُنْتُمْ أَعْدَاءً فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُمْ بِنِعْمَتِهِ إِخْوَانًا وَكُنْتُمْ عَلَىٰ شَفَا حُفْرَةٍ مِنَ النَّارِ فَأَنْقَذَكُمْ مِنْهَا كَذَٰلِكَ يُبَيِّنُ اللَّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَهْتَدُونَ", "surah": "سورة آل عمران", "ayah": 103}, {"text": "كُنْتُمْ خَيْرَ أُمَّةٍ أُخْرِجَتْ لِلنَّاسِ تَأْمُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ الْمُنْكَرِ وَتُؤْمِنُونَ بِاللَّهِ وَلَوْ آمَنَ أَهْلُ الْكِتَابِ لَكَانَ خَيْرًا لَهُمْ مِنْهُمُ الْمُؤْمِنُونَ وَأَكْثَرُهُمُ الْفَاسِقُونَ", "surah": "سورة آل عمران", "ayah": 110}, {"text": "وَأَطِيعُوا اللَّهَ وَالرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ", "surah": "سورة آل عمران", "ayah": 132}, {"text": "أَمْ حَسِبْتُمْ أَنْ تَدْخُلُوا الْجَنَّةَ وَلَمَّا يَعْلَمِ اللَّهُ الَّذِينَ جَاهَدُوا مِنْكُمْ وَيَعْلَمَ الصَّابِرِينَ", "surah": "سورة آل عمران", "ayah": 142}, {"text": "وَمَا كَانَ لِنَفْسٍ أَنْ تَمُوتَ إِلَّا بِإِذْنِ اللَّهِ كِتَابًا مُؤَجَّلًا وَمَنْ يُرِدْ ثَوَابَ الدُّنْيَا نُؤْتِهِ مِنْهَا وَمَنْ يُرِدْ ثَوَابَ الْآخِرَةِ نُؤْتِهِ مِنْهَا وَسَنَجْزِي الشَّاكِرِينَ", "surah": "سورة آل عمران", "ayah": 145}, {"text": "فَبِمَا رَحْمَةٍ مِنَ اللَّهِ لِنْتَ لَهُمْ وَلَوْ كُنْتَ فَظًّا غَلِيظَ الْقَلْبِ لَانْفَضُّوا مِنْ حَوْلِكَ فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ", "surah": "سورة آل عمران", "ayah": 159}, {"text": "لَقَدْ مَنَّ اللَّهُ عَلَى الْمُؤْمِنِينَ إِذْ بَعَثَ فِيهِمْ رَسُولًا مِنْ أَنْفُسِهِمْ يَتْلُو عَلَيْهِمْ آيَاتِهِ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَإِنْ كَانُوا مِنْ قَبْلُ لَفِي ضَلَالٍ مُبِينٍ", "surah": "سورة آل عمران", "ayah": 164}, {"text": "وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة آل عمران", "ayah": 189}, {"text": "رَبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ", "surah": "سورة آل عمران", "ayah": 193}, {"text": "يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالًا كَثِيرًا وَنِسَاءً وَاتَّقُوا اللَّهَ الَّذِي تَسَاءَلُونَ بِهِ وَالْأَرْحَامَ إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا", "surah": "سورة النساء", "ayah": 1}, {"text": "وَاللَّهُ يُرِيدُ أَنْ يَتُوبَ عَلَيْكُمْ وَيُرِيدُ الَّذِينَ يَتَّبِعُونَ الشَّهَوَاتِ أَنْ تَمِيلُوا مَيْلًا عَظِيمًا", "surah": "سورة النساء", "ayah": 27}, {"text": "وَلَا تَتَمَنَّوْا مَا فَضَّلَ اللَّهُ بِهِ بَعْضَكُمْ عَلَىٰ بَعْضٍ لِلرِّجَالِ نَصِيبٌ مِمَّا اكْتَسَبُوا وَلِلنِّسَاءِ نَصِيبٌ مِمَّا اكْتَسَبْنَ وَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ إِنَّ اللَّهَ كَانَ بِكُلِّ شَيْءٍ عَلِيمًا", "surah": "سورة النساء", "ayah": 32}, {"text": "وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا وَبِالْوَالِدَيْنِ إِحْسَانًا وَبِذِي الْقُرْبَىٰ وَالْيَتَامَىٰ وَالْمَسَاكِينِ وَالْجَارِ ذِي الْقُرْبَىٰ وَالْجَارِ الْجُنُبِ وَالصَّاحِبِ بِالْجَنْبِ وَابْنِ السَّبِيلِ وَمَا مَلَكَتْ أَيْمَانُكُمْ إِنَّ اللَّهَ لَا يُحِبُّ مَنْ كَانَ مُخْتَالًا فَخُورًا", "surah": "سورة النساء", "ayah": 36}, {"text": "إِنَّ اللَّهَ يَأْمُرُكُمْ أَنْ تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُمْ بَيْنَ النَّاسِ أَنْ تَحْكُمُوا بِالْعَدْلِ إِنَّ اللَّهَ نِعِمَّا يَعِظُكُمْ بِهِ إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا", "surah": "سورة النساء", "ayah": 58}, {"text": "وَمَنْ يُطِعِ اللَّهَ وَالرَّسُولَ فَأُولَٰئِكَ مَعَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِمْ مِنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ وَحَسُنَ أُولَٰئِكَ رَفِيقًا", "surah": "سورة النساء", "ayah": 69}, {"text": "لَا خَيْرَ فِي كَثِيرٍ مِنْ نَجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَاحٍ بَيْنَ النَّاسِ وَمَنْ يَفْعَلْ ذَٰلِكَ ابْتِغَاءَ مَرْضَاتِ اللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا", "surah": "سورة النساء", "ayah": 114}, {"text": "وَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ مِنْ ذَكَرٍ أَوْ أُنْثَىٰ وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ يَدْخُلُونَ الْجَنَّةَ وَلَا يُظْلَمُونَ نَقِيرًا", "surah": "سورة النساء", "ayah": 124}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنْفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ إِنْ يَكُنْ غَنِيًّا أَوْ فَقِيرًا فَاللَّهُ أَوْلَىٰ بِهِمَا فَلَا تَتَّبِعُوا الْهَوَىٰ أَنْ تَعْدِلُوا وَإِنْ تَلْوُوا أَوْ تُعْرِضُوا فَإِنَّ اللَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيرًا", "surah": "سورة النساء", "ayah": 135}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ لِلَّهِ شُهَدَاءَ بِالْقِسْطِ وَلَا يَجْرِمَنَّكُمْ شَنَآنُ قَوْمٍ عَلَىٰ أَلَّا تَعْدِلُوا اعْدِلُوا هُوَ أَقْرَبُ لِلتَّقْوَىٰ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ خَبِيرٌ بِمَا تَعْمَلُونَ", "surah": "سورة المائـدة", "ayah": 8}, {"text": "وَعَدَ اللَّهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ عَظِيمٌ", "surah": "سورة المائـدة", "ayah": 9}, {"text": "وَإِذَا جَاءَكَ الَّذِينَ يُؤْمِنُونَ بِآيَاتِنَا فَقُلْ سَلَامٌ عَلَيْكُمْ كَتَبَ رَبُّكُمْ عَلَىٰ نَفْسِهِ الرَّحْمَةَ أَنَّهُ مَنْ عَمِلَ مِنْكُمْ سُوءًا بِجَهَالَةٍ ثُمَّ تَابَ مِنْ بَعْدِهِ وَأَصْلَحَ فَأَنَّهُ غَفُورٌ رَحِيمٌ", "surah": "سورة الأنعام", "ayah": 54}, {"text": "وَعِنْدَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ وَمَا تَسْقُطُ مِنْ وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُبِينٍ", "surah": "سورة الأنعام", "ayah": 59}, {"text": "الَّذِينَ آمَنُوا وَلَمْ يَلْبِسُوا إِيمَانَهُمْ بِظُلْمٍ أُولَٰئِكَ لَهُمُ الْأَمْنُ وَهُمْ مُهْتَدُونَ", "surah": "سورة الأنعام", "ayah": 82}, {"text": "ذَٰلِكُمُ اللَّهُ رَبُّكُمْ لَا إِلَٰهَ إِلَّا هُوَ خَالِقُ كُلِّ شَيْءٍ فَاعْبُدُوهُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ", "surah": "سورة الأنعام", "ayah": 102}, {"text": "وَذَرُوا ظَاهِرَ الْإِثْمِ وَبَاطِنَهُ إِنَّ الَّذِينَ يَكْسِبُونَ الْإِثْمَ سَيُجْزَوْنَ بِمَا كَانُوا يَقْتَرِفُونَ", "surah": "سورة الأنعام", "ayah": 120}, {"text": "وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِمْ بَرَكَاتٍ مِنَ السَّمَاءِ وَالْأَرْضِ وَلَٰكِنْ كَذَّبُوا فَأَخَذْنَاهُمْ بِمَا كَانُوا يَكْسِبُونَ", "surah": "سورة الأعراف", "ayah": 96}, {"text": "قَالَ مُوسَىٰ لِقَوْمِهِ اسْتَعِينُوا بِاللَّهِ وَاصْبِرُوا إِنَّ الْأَرْضَ لِلَّهِ يُورِثُهَا مَنْ يَشَاءُ مِنْ عِبَادِهِ وَالْعَاقِبَةُ لِلْمُتَّقِينَ", "surah": "سورة الأعراف", "ayah": 128}, {"text": "قَالَ رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", "surah": "سورة الأعراف", "ayah": 151}, {"text": "وَاذْكُرْ رَبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُنْ مِنَ الْغَافِلِينَ", "surah": "سورة الأعراف", "ayah": 205}, {"text": "وَالْمُؤْمِنُونَ وَالْمُؤْمِنَاتُ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ يَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنْكَرِ وَيُقِيمُونَ الصَّلَاةَ وَيُؤْتُونَ الزَّكَاةَ وَيُطِيعُونَ اللَّهَ وَرَسُولَهُ أُولَٰئِكَ سَيَرْحَمُهُمُ اللَّهُ إِنَّ اللَّهَ عَزِيزٌ حَكِيمٌ", "surah": "سورة التوبة", "ayah": 71}, {"text": "وَعَدَ اللَّهُ الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا وَمَسَاكِنَ طَيِّبَةً فِي جَنَّاتِ عَدْنٍ وَرِضْوَانٌ مِنَ اللَّهِ أَكْبَرُ ذَٰلِكَ هُوَ الْفَوْزُ الْعَظِيمُ", "surah": "سورة التوبة", "ayah": 72}, {"text": "وَاللَّهُ يَدْعُو إِلَىٰ دَارِ السَّلَامِ وَيَهْدِي مَنْ يَشَاءُ إِلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "surah": "سورة يونس", "ayah": 25}, {"text": "لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٌ وَلَا ذِلَّةٌ أُولَٰئِكَ أَصْحَابُ الْجَنَّةِ هُمْ فِيهَا خَالِدُونَ", "surah": "سورة يونس", "ayah": 26}, {"text": "وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ وَإِنْ يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ يُصِيبُ بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ وَهُوَ الْغَفُورُ الرَّحِيمُ", "surah": "سورة يونس", "ayah": 107}, {"text": "وَيَا قَوْمِ اسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ يُرْسِلِ السَّمَاءَ عَلَيْكُمْ مِدْرَارًا وَيَزِدْكُمْ قُوَّةً إِلَىٰ قُوَّتِكُمْ وَلَا تَتَوَلَّوْا مُجْرِمِينَ", "surah": "سورة هود", "ayah": 52}, {"text": "إِنِّي تَوَكَّلْتُ عَلَى اللَّهِ رَبِّي وَرَبِّكُمْ مَا مِنْ دَابَّةٍ إِلَّا هُوَ آخِذٌ بِنَاصِيَتِهَا إِنَّ رَبِّي عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ", "surah": "سورة هود", "ayah": 56}, {"text": "وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَيْهِ يُرْجَعُ الْأَمْرُ كُلُّهُ فَاعْبُدْهُ وَتَوَكَّلْ عَلَيْهِ وَمَا رَبُّكَ بِغَافِلٍ عَمَّا تَعْمَلُونَ", "surah": "سورة هود", "ayah": 123}, {"text": "رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِنْ تَأْوِيلِ الْأَحَادِيثِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", "surah": "سورة يوسف", "ayah": 101}, {"text": "قُلْ هَٰذِهِ سَبِيلِي أَدْعُو إِلَى اللَّهِ عَلَىٰ بَصِيرَةٍ أَنَا وَمَنِ اتَّبَعَنِي وَسُبْحَانَ اللَّهِ وَمَا أَنَا مِنَ الْمُشْرِكِينَ", "surah": "سورة يوسف", "ayah": 108}, {"text": "لَهُ مُعَقِّبَاتٌ مِنْ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللَّهِ إِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنْفُسِهِمْ وَإِذَا أَرَادَ اللَّهُ بِقَوْمٍ سُوءًا فَلَا مَرَدَّ لَهُ وَمَا لَهُمْ مِنْ دُونِهِ مِنْ وَالٍ", "surah": "سورة الرعد", "ayah": 11}, {"text": "اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ وَيَقْدِرُ وَفَرِحُوا بِالْحَيَاةِ الدُّنْيَا وَمَا الْحَيَاةُ الدُّنْيَا فِي الْآخِرَةِ إِلَّا مَتَاعٌ", "surah": "سورة الرعد", "ayah": 26}, {"text": "يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ فِي الْحَيَاةِ الدُّنْيَا وَفِي الْآخِرَةِ وَيُضِلُّ اللَّهُ الظَّالِمِينَ وَيَفْعَلُ اللَّهُ مَا يَشَاءُ", "surah": "سورة إبراهيم", "ayah": 27}, {"text": "قُلْ لِعِبَادِيَ الَّذِينَ آمَنُوا يُقِيمُوا الصَّلَاةَ وَيُنْفِقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً مِنْ قَبْلِ أَنْ يَأْتِيَ يَوْمٌ لَا بَيْعٌ فِيهِ وَلَا خِلَالٌ", "surah": "سورة إبراهيم", "ayah": 31}, {"text": "وَاللَّهُ أَخْرَجَكُمْ مِنْ بُطُونِ أُمَّهَاتِكُمْ لَا تَعْلَمُونَ شَيْئًا وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ لَعَلَّكُمْ تَشْكُرُونَ", "surah": "سورة النحل", "ayah": 78}, {"text": "وَأَوْفُوا بِعَهْدِ اللَّهِ إِذَا عَاهَدْتُمْ وَلَا تَنْقُضُوا الْأَيْمَانَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اللَّهَ عَلَيْكُمْ كَفِيلًا إِنَّ اللَّهَ يَعْلَمُ مَا تَفْعَلُونَ", "surah": "سورة النحل", "ayah": 91}, {"text": "فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "surah": "سورة النحل", "ayah": 98}, {"text": "وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِنْدَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُلْ لَهُمَا قَوْلًا كَرِيمًا", "surah": "سورة الإسراء", "ayah": 23}, {"text": "رَبُّكُمْ أَعْلَمُ بِمَا فِي نُفُوسِكُمْ إِنْ تَكُونُوا صَالِحِينَ فَإِنَّهُ كَانَ لِلْأَوَّابِينَ غَفُورًا", "surah": "سورة الإسراء", "ayah": 25}, {"text": "وَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا", "surah": "سورة الإسراء", "ayah": 26}, {"text": "وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَحْسُورًا", "surah": "سورة الإسراء", "ayah": 29}, {"text": "وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا", "surah": "سورة الإسراء", "ayah": 34}, {"text": "وَأَوْفُوا الْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا", "surah": "سورة الإسراء", "ayah": 35}, {"text": "تُسَبِّحُ لَهُ السَّمَاوَاتُ السَّبْعُ وَالْأَرْضُ وَمَنْ فِيهِنَّ وَإِنْ مِنْ شَيْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِ وَلَٰكِنْ لَا تَفْقَهُونَ تَسْبِيحَهُمْ إِنَّهُ كَانَ حَلِيمًا غَفُورًا", "surah": "سورة الإسراء", "ayah": 44}, {"text": "وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَكَ عَسَىٰ أَنْ يَبْعَثَكَ رَبُّكَ مَقَامًا مَحْمُودًا", "surah": "سورة الإسراء", "ayah": 79}, {"text": "وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ وَكَبِّرْهُ تَكْبِيرًا", "surah": "سورة الإسراء", "ayah": 111}, {"text": "وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُمْ بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَنْ ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا", "surah": "سورة الكهف", "ayah": 28}, {"text": "قُلْ لَوْ كَانَ الْبَحْرُ مِدَادًا لِكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَنْ تَنْفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا", "surah": "سورة الكهف", "ayah": 109}, {"text": "قُلْ إِنَّمَا أَنَا بَشَرٌ مِثْلُكُمْ يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ فَمَنْ كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا", "surah": "سورة الكهف", "ayah": 110}, {"text": "رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَادَتِهِ هَلْ تَعْلَمُ لَهُ سَمِيًّا", "surah": "سورة مريم", "ayah": 65}, {"text": "وَيَزِيدُ اللَّهُ الَّذِينَ اهْتَدَوْا هُدًى وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِنْدَ رَبِّكَ ثَوَابًا وَخَيْرٌ مَرَدًّا", "surah": "سورة مريم", "ayah": 76}, {"text": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ", "surah": "سورة طه", "ayah": 8}, {"text": "وَمَنْ أَعْرَضَ عَنْ ذِكْرِي فَإِنَّ لَهُ مَعِيشَةً ضَنْكًا وَنَحْشُرُهُ يَوْمَ الْقِيَامَةِ أَعْمَىٰ", "surah": "سورة طه", "ayah": 124}, {"text": "فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا وَمِنْ آنَاءِ اللَّيْلِ فَسَبِّحْ وَأَطْرَافَ النَّهَارِ لَعَلَّكَ تَرْضَىٰ", "surah": "سورة طه", "ayah": 130}, {"text": "وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِ أَزْوَاجًا مِنْهُمْ زَهْرَةَ الْحَيَاةِ الدُّنْيَا لِنَفْتِنَهُمْ فِيهِ وَرِزْقُ رَبِّكَ خَيْرٌ وَأَبْقَىٰ", "surah": "سورة طه", "ayah": 131}, {"text": "وَنَضَعُ الْمَوَازِينَ الْقِسْطَ لِيَوْمِ الْقِيَامَةِ فَلَا تُظْلَمُ نَفْسٌ شَيْئًا وَإِنْ كَانَ مِثْقَالَ حَبَّةٍ مِنْ خَرْدَلٍ أَتَيْنَا بِهَا وَكَفَىٰ بِنَا حَاسِبِينَ", "surah": "سورة الأنبياء", "ayah": 47}, {"text": "ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ السَّيِّئَةَ نَحْنُ أَعْلَمُ بِمَا يَصِفُونَ", "surah": "سورة المؤمنون", "ayah": 96}, {"text": "وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ", "surah": "سورة المؤمنون", "ayah": 97}, {"text": "وَلَا يَأْتَلِ أُولُو الْفَضْلِ مِنْكُمْ وَالسَّعَةِ أَنْ يُؤْتُوا أُولِي الْقُرْبَىٰ وَالْمَسَاكِينَ وَالْمُهَاجِرِينَ فِي سَبِيلِ اللَّهِ وَلْيَعْفُوا وَلْيَصْفَحُوا أَلَا تُحِبُّونَ أَنْ يَغْفِرَ اللَّهُ لَكُمْ وَاللَّهُ غَفُورٌ رَحِيمٌ", "surah": "سورة النور", "ayah": 22}, {"text": "اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ مَثَلُ نُورِهِ كَمِشْكَاةٍ فِيهَا مِصْبَاحٌ الْمِصْبَاحُ فِي زُجَاجَةٍ الزُّجَاجَةُ كَأَنَّهَا كَوْكَبٌ دُرِّيٌّ يُوقَدُ مِنْ شَجَرَةٍ مُبَارَكَةٍ زَيْتُونَةٍ لَا شَرْقِيَّةٍ وَلَا غَرْبِيَّةٍ يَكَادُ زَيْتُهَا يُضِيءُ وَلَوْ لَمْ تَمْسَسْهُ نَارٌ نُورٌ عَلَىٰ نُورٍ يَهْدِي اللَّهُ لِنُورِهِ مَنْ يَشَاءُ وَيَضْرِبُ اللَّهُ الْأَمْثَالَ لِلنَّاسِ وَاللَّهُ بِكُلِّ شَيْءٍ عَلِيمٌ", "surah": "سورة النور", "ayah": 35}, {"text": "وَمَنْ تَابَ وَعَمِلَ صَالِحًا فَإِنَّهُ يَتُوبُ إِلَى اللَّهِ مَتَابًا", "surah": "سورة الفرقان", "ayah": 71}, {"text": "وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ", "surah": "سورة الشعراء", "ayah": 84}, {"text": "وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ", "surah": "سورة الشعراء", "ayah": 85}, {"text": "وَلَا تُخْزِنِي يَوْمَ يُبْعَثُونَ", "surah": "سورة الشعراء", "ayah": 87}, {"text": "قُلِ الْحَمْدُ لِلَّهِ وَسَلَامٌ عَلَىٰ عِبَادِهِ الَّذِينَ اصْطَفَىٰ آللَّهُ خَيْرٌ أَمَّا يُشْرِكُونَ", "surah": "سورة النمل", "ayah": 59}, {"text": "وَهُوَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ لَهُ الْحَمْدُ فِي الْأُولَىٰ وَالْآخِرَةِ وَلَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة القصص", "ayah": 70}, {"text": "وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ وَلَا تَنْسَ نَصِيبَكَ مِنَ الدُّنْيَا وَأَحْسِنْ كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ إِنَّ اللَّهَ لَا يُحِبُّ الْمُفْسِدِينَ", "surah": "سورة القصص", "ayah": 77}, {"text": "وَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا إِلَٰهَ إِلَّا هُوَ كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ لَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة القصص", "ayah": 88}, {"text": "اتْلُ مَا أُوحِيَ إِلَيْكَ مِنَ الْكِتَابِ وَأَقِمِ الصَّلَاةَ إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَلَذِكْرُ اللَّهِ أَكْبَرُ وَاللَّهُ يَعْلَمُ مَا تَصْنَعُونَ", "surah": "سورة العنكبوت", "ayah": 45}, {"text": "وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُبَوِّئَنَّهُمْ مِنَ الْجَنَّةِ غُرَفًا تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا نِعْمَ أَجْرُ الْعَامِلِينَ", "surah": "سورة العنكبوت", "ayah": 58}, {"text": "وَكَأَيِّنْ مِنْ دَابَّةٍ لَا تَحْمِلُ رِزْقَهَا اللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ وَهُوَ السَّمِيعُ الْعَلِيمُ", "surah": "سورة العنكبوت", "ayah": 60}, {"text": "فَسُبْحَانَ اللَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ", "surah": "سورة الروم", "ayah": 17}, {"text": "وَمِنْ آيَاتِهِ خَلْقُ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافُ أَلْسِنَتِكُمْ وَأَلْوَانِكُمْ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِلْعَالِمِينَ", "surah": "سورة الروم", "ayah": 22}, {"text": "فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اللَّهِ ذَٰلِكَ الدِّينُ الْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ", "surah": "سورة الروم", "ayah": 30}, {"text": "وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ حَمَلَتْهُ أُمُّهُ وَهْنًا عَلَىٰ وَهْنٍ وَفِصَالُهُ فِي عَامَيْنِ أَنِ اشْكُرْ لِي وَلِوَالِدَيْكَ إِلَيَّ الْمَصِيرُ", "surah": "سورة لقمان", "ayah": 14}, {"text": "يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمْ وَاخْشَوْا يَوْمًا لَا يَجْزِي وَالِدٌ عَنْ وَلَدِهِ وَلَا مَوْلُودٌ هُوَ جَازٍ عَنْ وَالِدِهِ شَيْئًا إِنَّ وَعْدَ اللَّهِ حَقٌّ فَلَا تَغُرَّنَّكُمُ الْحَيَاةُ الدُّنْيَا وَلَا يَغُرَّنَّكُمْ بِاللَّهِ الْغَرُورُ", "surah": "سورة لقمان", "ayah": 33}, {"text": "إِنَّ اللَّهَ عِنْدَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ وَيَعْلَمُ مَا فِي الْأَرْحَامِ وَمَا تَدْرِي نَفْسٌ مَاذَا تَكْسِبُ غَدًا وَمَا تَدْرِي نَفْسٌ بِأَيِّ أَرْضٍ تَمُوتُ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ", "surah": "سورة لقمان", "ayah": 34}, {"text": "إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَالْقَانِتِينَ وَالْقَانِتَاتِ وَالصَّادِقِينَ وَالصَّادِقَاتِ وَالصَّابِرِينَ وَالصَّابِرَاتِ وَالْخَاشِعِينَ وَالْخَاشِعَاتِ وَالْمُتَصَدِّقِينَ وَالْمُتَصَدِّقَاتِ وَالصَّائِمِينَ وَالصَّائِمَاتِ وَالْحَافِظِينَ فُرُوجَهُمْ وَالْحَافِظَاتِ وَالذَّاكِرِينَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتِ أَعَدَّ اللَّهُ لَهُمْ مَغْفِرَةً وَأَجْرًا عَظِيمًا", "surah": "سورة الأحزاب", "ayah": 35}, {"text": "هُوَ الَّذِي يُصَلِّي عَلَيْكُمْ وَمَلَائِكَتُهُ لِيُخْرِجَكُمْ مِنَ الظُّلُمَاتِ إِلَى النُّورِ وَكَانَ بِالْمُؤْمِنِينَ رَحِيمًا", "surah": "سورة الأحزاب", "ayah": 43}, {"text": "قُلْ إِنَّ رَبِّي يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ وَمَا أَنْفَقْتُمْ مِنْ شَيْءٍ فَهُوَ يُخْلِفُهُ وَهُوَ خَيْرُ الرَّازِقِينَ", "surah": "سورة سبإ", "ayah": 39}, {"text": "مَا يَفْتَحِ اللَّهُ لِلنَّاسِ مِنْ رَحْمَةٍ فَلَا مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلَا مُرْسِلَ لَهُ مِنْ بَعْدِهِ وَهُوَ الْعَزِيزُ الْحَكِيمُ", "surah": "سورة فاطر", "ayah": 2}, {"text": "مَنْ كَانَ يُرِيدُ الْعِزَّةَ فَلِلَّهِ الْعِزَّةُ جَمِيعًا إِلَيْهِ يَصْعَدُ الْكَلِمُ الطَّيِّبُ وَالْعَمَلُ الصَّالِحُ يَرْفَعُهُ وَالَّذِينَ يَمْكُرُونَ السَّيِّئَاتِ لَهُمْ عَذَابٌ شَدِيدٌ وَمَكْرُ أُولَٰئِكَ هُوَ يَبُورُ", "surah": "سورة فاطر", "ayah": 10}, {"text": "إِنَّ الَّذِينَ يَتْلُونَ كِتَابَ اللَّهِ وَأَقَامُوا الصَّلَاةَ وَأَنْفَقُوا مِمَّا رَزَقْنَاهُمْ سِرًّا وَعَلَانِيَةً يَرْجُونَ تِجَارَةً لَنْ تَبُورَ", "surah": "سورة فاطر", "ayah": 29}, {"text": "فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ", "surah": "سورة يس", "ayah": 83}, {"text": "كِتَابٌ أَنْزَلْنَاهُ إِلَيْكَ مُبَارَكٌ لِيَدَّبَّرُوا آيَاتِهِ وَلِيَتَذَكَّرَ أُولُو الْأَلْبَابِ", "surah": "سورة ص", "ayah": 29}, {"text": "أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا يَحْذَرُ الْآخِرَةَ وَيَرْجُو رَحْمَةَ رَبِّهِ قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ إِنَّمَا يَتَذَكَّرُ أُولُو الْأَلْبَابِ", "surah": "سورة الزمر", "ayah": 9}, {"text": "اللَّهُ يَتَوَفَّى الْأَنْفُسَ حِينَ مَوْتِهَا وَالَّتِي لَمْ تَمُتْ فِي مَنَامِهَا فَيُمْسِكُ الَّتِي قَضَىٰ عَلَيْهَا الْمَوْتَ وَيُرْسِلُ الْأُخْرَىٰ إِلَىٰ أَجَلٍ مُسَمًّى إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِقَوْمٍ يَتَفَكَّرُونَ", "surah": "سورة الزمر", "ayah": 42}, {"text": "يَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ", "surah": "سورة غافر", "ayah": 19}, {"text": "إِنَّا لَنَنْصُرُ رُسُلَنَا وَالَّذِينَ آمَنُوا فِي الْحَيَاةِ الدُّنْيَا وَيَوْمَ يَقُومُ الْأَشْهَادُ", "surah": "سورة غافر", "ayah": 51}, {"text": "إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ", "surah": "سورة فصلت", "ayah": 8}, {"text": "وَهُوَ الَّذِي يُنَزِّلُ الْغَيْثَ مِنْ بَعْدِ مَا قَنَطُوا وَيَنْشُرُ رَحْمَتَهُ وَهُوَ الْوَلِيُّ الْحَمِيدُ", "surah": "سورة الشورى", "ayah": 28}, {"text": "وَوَصَّيْنَا الْإِنْسَانَ بِوَالِدَيْهِ إِحْسَانًا حَمَلَتْهُ أُمُّهُ كُرْهًا وَوَضَعَتْهُ كُرْهًا وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْرًا حَتَّىٰ إِذَا بَلَغَ أَشُدَّهُ وَبَلَغَ أَرْبَعِينَ سَنَةً قَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ", "surah": "سورة الأحقاف", "ayah": 15}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِنْ جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا أَنْ تُصِيبُوا قَوْمًا بِجَهَالَةٍ فَتُصْبِحُوا عَلَىٰ مَا فَعَلْتُمْ نَادِمِينَ", "surah": "سورة الحجرات", "ayah": 6}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَسْخَرْ قَوْمٌ مِنْ قَوْمٍ عَسَىٰ أَنْ يَكُونُوا خَيْرًا مِنْهُمْ وَلَا نِسَاءٌ مِنْ نِسَاءٍ عَسَىٰ أَنْ يَكُنَّ خَيْرًا مِنْهُنَّ وَلَا تَلْمِزُوا أَنْفُسَكُمْ وَلَا تَنَابَزُوا بِالْأَلْقَابِ بِئْسَ الِاسْمُ الْفُسُوقُ بَعْدَ الْإِيمَانِ وَمَنْ لَمْ يَتُبْ فَأُولَٰئِكَ هُمُ الظَّالِمُونَ", "surah": "سورة الحجرات", "ayah": 11}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ وَلَا تَجَسَّسُوا وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَنْ يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ تَوَّابٌ رَحِيمٌ", "surah": "سورة الحجرات", "ayah": 12}, {"text": "وَفِي أَنْفُسِكُمْ أَفَلَا تُبْصِرُونَ", "surah": "سورة الذاريات", "ayah": 21}, {"text": "وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ", "surah": "سورة الذاريات", "ayah": 22}, {"text": "وَمِنَ اللَّيْلِ فَسَبِّحْهُ وَإِدْبَارَ النُّجُومِ", "surah": "سورة الطور", "ayah": 49}, {"text": "إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ", "surah": "سورة القمر", "ayah": 49}, {"text": "لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ يُحْيِي وَيُمِيتُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "surah": "سورة الحديد", "ayah": 2}, {"text": "أَلَمْ يَأْنِ لِلَّذِينَ آمَنُوا أَنْ تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اللَّهِ وَمَا نَزَلَ مِنَ الْحَقِّ وَلَا يَكُونُوا كَالَّذِينَ أُوتُوا الْكِتَابَ مِنْ قَبْلُ فَطَالَ عَلَيْهِمُ الْأَمَدُ فَقَسَتْ قُلُوبُهُمْ وَكَثِيرٌ مِنْهُمْ فَاسِقُونَ", "surah": "سورة الحديد", "ayah": 16}, {"text": "سَابِقُوا إِلَىٰ مَغْفِرَةٍ مِنْ رَبِّكُمْ وَجَنَّةٍ عَرْضُهَا كَعَرْضِ السَّمَاءِ وَالْأَرْضِ أُعِدَّتْ لِلَّذِينَ آمَنُوا بِاللَّهِ وَرُسُلِهِ ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ", "surah": "سورة الحديد", "ayah": 21}, {"text": "مَا أَصَابَ مِنْ مُصِيبَةٍ فِي الْأَرْضِ وَلَا فِي أَنْفُسِكُمْ إِلَّا فِي كِتَابٍ مِنْ قَبْلِ أَنْ نَبْرَأَهَا إِنَّ ذَٰلِكَ عَلَى اللَّهِ يَسِيرٌ", "surah": "سورة الحديد", "ayah": 22}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قِيلَ لَكُمْ تَفَسَّحُوا فِي الْمَجَالِسِ فَافْسَحُوا يَفْسَحِ اللَّهُ لَكُمْ وَإِذَا قِيلَ انْشُزُوا فَانْشُزُوا يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنْكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌ", "surah": "سورة المجادلة", "ayah": 11}, {"text": "وَالَّذِينَ جَاءُوا مِنْ بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَحِيمٌ", "surah": "سورة الحشر", "ayah": 10}, {"text": "هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ", "surah": "سورة الحشر", "ayah": 23}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ذَٰلِكُمْ خَيْرٌ لَكُمْ إِنْ كُنْتُمْ تَعْلَمُونَ", "surah": "سورة الجمعة", "ayah": 9}, {"text": "وَأَنْفِقُوا مِنْ مَا رَزَقْنَاكُمْ مِنْ قَبْلِ أَنْ يَأْتِيَ أَحَدَكُمُ الْمَوْتُ فَيَقُولَ رَبِّ لَوْلَا أَخَّرْتَنِي إِلَىٰ أَجَلٍ قَرِيبٍ فَأَصَّدَّقَ وَأَكُنْ مِنَ الصَّالِحِينَ", "surah": "سورة المنافقون", "ayah": 10}, {"text": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ", "surah": "سورة التغابن", "ayah": 13}, {"text": "إِنْ تُقْرِضُوا اللَّهَ قَرْضًا حَسَنًا يُضَاعِفْهُ لَكُمْ وَيَغْفِرْ لَكُمْ وَاللَّهُ شَكُورٌ حَلِيمٌ", "surah": "سورة التغابن", "ayah": 17}, {"text": "لِيُنْفِقْ ذُو سَعَةٍ مِنْ سَعَتِهِ وَمَنْ قُدِرَ عَلَيْهِ رِزْقُهُ فَلْيُنْفِقْ مِمَّا آتَاهُ اللَّهُ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا مَا آتَاهَا سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا", "surah": "سورة الطلاق", "ayah": 7}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا قُوا أَنْفُسَكُمْ وَأَهْلِيكُمْ نَارًا وَقُودُهَا النَّاسُ وَالْحِجَارَةُ عَلَيْهَا مَلَائِكَةٌ غِلَاظٌ شِدَادٌ لَا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ", "surah": "سورة التحريم", "ayah": 6}, {"text": "يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى اللَّهِ تَوْبَةً نَصُوحًا عَسَىٰ رَبُّكُمْ أَنْ يُكَفِّرَ عَنْكُمْ سَيِّئَاتِكُمْ وَيُدْخِلَكُمْ جَنَّاتٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ يَوْمَ لَا يُخْزِي اللَّهُ النَّبِيَّ وَالَّذِينَ آمَنُوا مَعَهُ نُورُهُمْ مَنْ شَهِدَ مِنْكُمُ الشَّهْرَ فَلْيَصُمْهُ وَمَنْ كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِنْ أَيَّامٍ أُخَرَ يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ", "surah": "سورة البقرة", "ayah": 185}, {"text": "وَمَثَلُ الَّذِينَ يُنْفِقُونَ أَمْوَالَهُمُ ابْتِغَاءَ مَرْضَاتِ اللَّهِ وَتَثْبِيتًا مِنْ أَنْفُسِهِمْ كَمَثَلِ جَنَّةٍ بِرَبْوَةٍ أَصَابَهَا وَابِلٌ فَآتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِنْ لَمْ يُصِبْهَا وَابِلٌ فَطَلٌّ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ", "surah": "سورة البقرة", "ayah": 265}, {"text": "آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ", "surah": "سورة البقرة", "ayah": 285}, {"text": "إِنَّمَا التَّوْبَةُ عَلَى اللَّهِ لِلَّذِينَ يَعْمَلُونَ السُّوءَ بِجَهَالَةٍ ثُمَّ يَتُوبُونَ مِنْ قَرِيبٍ فَأُولَٰئِكَ يَتُوبُ اللَّهُ عَلَيْهِمْ وَكَانَ اللَّهُ عَلِيمًا حَكِيمًا", "surah": "سورة النساء", "ayah": 17}, {"text": "مَا أَصَابَكَ مِنْ حَسَنَةٍ فَمِنَ اللَّهِ وَمَا أَصَابَكَ مِنْ سَيِّئَةٍ فَمِنْ نَفْسِكَ وَأَرْسَلْنَاكَ لِلنَّاسِ رَسُولًا وَكَفَىٰ بِاللَّهِ شَهِيدًا", "surah": "سورة النساء", "ayah": 79}, {"text": "لَيْسَ بِأَمَانِيِّكُمْ وَلَا أَمَانِيِّ أَهْلِ الْكِتَابِ مَنْ يَعْمَلْ سُوءًا يُجْزَ بِهِ وَلَا يَجِدْ لَهُ مِنْ دُونِ اللَّهِ وَلِيًّا وَلَا نَصِيرًا", "surah": "سورة النساء", "ayah": 123}, {"text": "الْحَمْدُ لِلَّهِ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَجَعَلَ الظُّلُمَاتِ وَالنُّورَ ثُمَّ الَّذِينَ كَفَرُوا بِرَبِّهِمْ يَعْدِلُونَ", "surah": "سورة الأنعام", "ayah": 1}, {"text": "وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ وَهُوَ الْحَكِيمُ الْخَبِيرُ", "surah": "سورة الأنعام", "ayah": 18}, {"text": "إِنَّ اللَّهَ فَالِقُ الْحَبِّ وَالنَّوَىٰ يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَمُخْرِجُ الْمَيِّتِ مِنَ الْحَيِّ ذَٰلِكُمُ اللَّه بلاغة · حكمة ٦٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَهْلُ الدُّنْيَا كَرَكْبٍ يُسَارُ بِهِمْ وَهُمْ نِيَامٌ."]], "source": "نهج البلاغة · حكمة ٦٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "فَوْتُ الْحَاجَةِ أَهْوَنُ مِنْ طَلَبِهَا إِلَى غَيْرِ أَهْلِهَا."]], "source": "نهج البلاغة · حكمة ٦٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا تَسْتَحِ مِنْ إِعْطَاءِ الْقَلِيلِ، فَإِنَّ الْحِرْمَانَ أَقَلُّ مِنْهُ."]], "source": "نهج البلاغة · حكمة ٦٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْعَفَافُ زِينَةُ الْفَقْرِ، والشُّكْرُ زِينَةُ الغِنَى."]], "source": "نهج البلاغة · حكمة ٦٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِذَا لَمْ يَكُنْ مَا تُرِيدُ فَلَا تُبَلْ مَا كُنْتَ."]], "source": "نهج البلاغة · حكمة ٦٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا تَرَى الْجَاهِلَ إِلَّا مُفْرِطاً أَوْ مُفَرِّطاً."]], "source": "نهج البلاغة · حكمة ٧٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الدَّهرُ يُخْلِقُ الْأَبْدَانَ، وَيُجَدِّدُ الْآمَالَ، وَيُقَرِّبُ الْمَنِيَّةَ، ويُبَاعِدُ الْأُمْنِيَّةَ، مَنْ ظَفِرَ بِهِ نَصِبَ، ومَنْ فَاتَهُ تَعِبَ."]], "source": "نهج البلاغة · حكمة ٧٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ نَصَبَ نَفْسَهُ لِلنَّاسِ إِمَاماً فَلْيَبْدَأْ بِتَعْلِيمِ نَفْسِهِ قَبْلَ تَعْلِيمِ غَيْرِهِ، وَلْيَكُنْ تَأْدِيبُهُ بِسِيرَتِهِ قَبْلَ تَأْدِيبِهِ بِلِسَانِهِ، وَمُعَلِّمُ نَفْسِهِ وَمُؤَدِّبُهَا أَحَقُّ بِالْإِجْلَالِ مِنْ مُعَلِّمِ النَّاسِ وَمُؤَدِّبِهِمْ."]], "source": "نهج البلاغة · حكمة ٧٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كُلُّ مَعْدُود مُنْقَض، وَكُلُّ مُتَوَقَّعٍ آتٍ."]], "source": "نهج البلاغة · حكمة ٧٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ الْأُمُورَ إذا اشْتَبَهَتْ اعْتُبِرَ آخِرُهَا بِأَوَّلِهَا."]], "source": "نهج البلاغة · حكمة ٧٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "خُذِ الْحِكْمَةَ أَنَّى كَانَتْ فَإِ قال أمير المؤمنين عليه السلام"], ["q", "غَيْرَةُ الْمَرْأَةِ كُفْرٌ وَغَيْرَةُ الرَّجُلِ إِيمَانٌ."]], "source": "نهج البلاغة · حكمة ١٢٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَأَنْسُبَنَّ الْإِسْلَامَ نِسْبَةً لَمْ يَنْسُبْهَا أَحَدٌ قَبْلِى الْإِسْلَامُ هُوَ التَّسْلِيمُ وَالتَّسْلِيمُ هُوَ الْيَقِينُ وَالْيَقِينُ هُوَ التَّصْدِيقُ وَالتَّصْدِيقُ هُوَ الْإِقْرَارُ وَالْإِقْرَارُ هُوَ الْأَدَاءُ وَالْأَدَاءُ هُوَ الْعَمَلُ."]], "source": "نهج البلاغة · حكمة ١٢٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عَجِبْتُ لِلْبَخِيلِ يَسْتَعْجِلُ الْفَقْرَ الَّذِى مِنْهُ هَرَبَ وَيَفُوتُهُ الْغِنَى الَّذِى إِيَّاهُ طَلَبَ فَيَعِيشُ فِى الدُّنْيَا عَيْشَ الْفُقَرَاءِ وَيُحَاسَبُ فِى الْآخِرَةِ حِسَابَ الْأَغْنِيَاءِ."]], "source": "نهج البلاغة · حكمة ١٢٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ قَصَّرَ فِى الْعَمَلِ ابْتُلِيَ بِالْهَمِّ وَلَا حَاجَةَ لِلَّهِ فِيمَنْ لَيْسَ لِلَّهِ فِى مَالِهِ وَنَفْسِهِ نَصِيبٌ."]], "source": "نهج البلاغة · حكمة ١٢٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "تَوَقَّوُا الْبَرْدَ فِى أَوَّلِهِ وَتَلَقَّوْهُ فِى آخِرِهِ فَإِنَّهُ يَفْعَلُ فِى الْأَبْدَانِ كَفِعْلِهِ فِى الْأَشْجَارِ أَوَّلُهُ يُحْرِقُ وَآخِرُهُ يُورِقُ."]], "source": "نهج البلاغة · حكمة ١٢٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عِظَمُ الْخَالِقِ عِنْدَكَ يُصَغِّرُ الْمَخْلُوقَ فِى عَيْنِكَ."]], "source": "نهج البلاغة · حكمة ١٢٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ لِلَّهِ مَلَكاً يُنَادِى فِى كُلِّ يَوْمٍ لِدُوا لِلْمَوْتِ وَاجْمَعُوا لِلْفَنَاءِ وَابْنُوا لِلْخَرَابِ."]], "source": "نهج البلاغة · حكمة ١٣٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الدُّنْيَا دَارُ مَمَرٍّ لَا دَارُ مَقَرٍّ وَالنَّاسُ فِيهَا رَجُلَانِ رَجُلٌ بَاعَ فِيهَا نَفْسَهُ فَأَوْبَقَهَا وَرَجُلٌ ابْتَاعَ نَفْسَهُ فَأَعْتَقَهَا."]], "source": "نهج البلاغة · حكمة ١٣٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا يَكُونُ الصَّدِيقُ صَدِ  عليه السلام"], ["q", "الرَّاضِي بِفِعْلِ قَوْمٍ كَالدَّاخِلِ فِيهِ مَعَهُمْ، وَعَلَى كُلِّ دَاخِلٍ فِي بَاطِلٍ إِثْمَانِ: إِثْمُ الْعَمَلِ بِهِ، وَإِثْمُ الرِّضَى بِهِ."]], "source": "نهج البلاغة · حكمة ١٥٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عَلَيْكُمْ بِطَاعَةِ مَنْ لَا تُعْذَرُونَ بِجَهَالَتِهِ."]], "source": "نهج البلاغة · حكمة ١٥٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "قَدْ بُصّرْتُمْ إِنْ أَبْصَرْتُمْ وَقَدْ هُدِيتُمْ إِنِ اهْتَدَيْتُمْ، وأُسْمِعْتُمْ إِنِ اسْتَمَعْتُمْ."]], "source": "نهج البلاغة · حكمة ١٥٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عَاتِبْ أَخَاكَ بِالْإِحْسَانِ إِلَيْهِ، وَارْدُدْ شَرَّهُ بِالْإِنْعَامِ عَلَيْهِ."]], "source": "نهج البلاغة · حكمة ١٥٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ وَضَعَ نَفْسَهُ مَوَاضِعَ التُّهَمَةِ فَلاَ يَلُومَنَّ مَنْ أَسَاءَ بِهِ الظَّنَّ."]], "source": "نهج البلاغة · حكمة ١٥٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنِ اسْتَبَدَّ بِرَأْيِهِ هَلَكَ، وَمَنْ شَاوَرَ الرِّجَالَ شَارَكَهَا فِي عُقُولِهَا."]], "source": "نهج البلاغة · حكمة ١٦١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ كَتَمَ سِرَّهُ كَانَتِ الْخِيرَةُ بِيَدِهِ."]], "source": "نهج البلاغة · حكمة ١٦٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ قَضَى حَقَّ مَنْ لَا يَقْضِي حَقَّهُ فَقَدْ عَبَدَهُ."]], "source": "نهج البلاغة · حكمة ١٦٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا طَاعَةَ لِمخْلُوقٍ فِي مَعْصِيَةِ الْخَالِقِ."]], "source": "نهج البلاغة · حكمة ١٦٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا يُعَابُ الْمَرْءُ بِتَأْخِيرِ حَقِّهِ، إِنَّمَا يُعَابُ مَنْ أَخَذَ مَا لَيْسَ لَهُ."]], "source": "نهج البلاغة · حكمة ١٦٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "تَرْكُ الذَّنْبِ أَهْوَنُ مِنْ طَلَبِ التَّوْبَةِ."]], "source": "نهج البلاغة · حكمة ١٧٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنِ اسْتَقْبَلَ وُجُ  عليه السلام"], ["q", "إِنَّ لِلْقُلُوبِ شَهْوَةً وَإِقْبَالًا وَإِدْبَاراً، فَأْتُوهَا مِنْ قِبَلِ شَهْوَتِهَا وَإِقْبَالِهَا، فَإِنَّ الْقَلْبَ إِذَا أُكْرِهَ عَمِيَ."]], "source": "نهج البلاغة · حكمة ١٩٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَمْ يَذْهَبْ مِنْ مَالِكَ مَا وَعَظَكَ."]], "source": "نهج البلاغة · حكمة ١٩٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ هذِهِ الْقُلُوبَ تَمَلُّ كَمَا تَمَلُّ الْأَبْدَانُ، فَابْتَغُوا لَهَا طَرَائِفَ الْحِكْمَةِ."]], "source": "نهج البلاغة · حكمة ١٩٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ مَعَ كُلِّ إِنْسَانٍ مَلَكَيْنِ يَحْفَظَانِهِ، فَإِذَا جَاءَ الْقَدَرُ خَلَّيَا بَيْنَهُ وَبَيْنَهُ، وَإِنَّ الْأَجَلَ جُنَّةٌ حَصِينَةٌ."]], "source": "نهج البلاغة · حكمة ٢٠١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَيُّهَا النَّاسُ، اتّقُوا اللهَ الَّذِي إِنْ قُلْتُمْ سمِعَ، وَإِنْ أَضْمَرْتُمْ عَلِمَ، وَبَادِرُوا الْمَوْتَ الَّذِي إِنْ هَرَبْتُمْ (مِنْهُ) أَدْرَكَكُمْ، وَإِنْ أَقَمْتُمْ أَخَذَكُمْ، وَإِنْ نَسِيتُمُوهُ ذَكَرَكُمْ."]], "source": "نهج البلاغة · حكمة ٢٠٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا يُزَهِّدَنَّكَ فِي الْمَعْرُوفِ مَنْ لَا يَشْكُرُهُ لَكَ، فَقَدْ يَشْكُرُكَ عَلَيْهِ مَنْ لَا يَسْتَمْتِعُ بِشَيْءٍ مِنْهُ، وَقَدْ تُدْرِكُ مِنْ شُكْرِ الشَّاكِرِ أَكْثَرَ مِمَّا أَضَاعَ الْكَافِرُ ﴿وَاللهُ يُحِبُّ الْمُحْسِنِينَ﴾."]], "source": "نهج البلاغة · حكمة ٢٠٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كُلُّ وِعَاءٍ يَضِيقُ بِمَا جُعِلَ فِيهِ إِلَّا وِعَاءَ الْعِلْمِ، فَإِنَّهُ يَتَّسِعُ بِهِ."]], "source": "نهج البلاغة · حكمة ٢٠٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَوَّلُ عِوَضِ الْحَلِيمِ مِنْ حِلْمِهِ أَنَّ النَّاسَ أَنْصَارُهُ عَلَى الْجَاهِلِ."]], "source": "نهج البلاغة · حكمة ٢٠٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنْ لَمْ تَكُنْ حَلِيماً فَتَحَلَّمْ، فَإِنَّهُ قَلَّ مَنْ تَشَبَّهَ بَقَوْمٍ إِلَّا أَوْشَكَ أَنْ يَكُونَ مِنْهُمْ."]], "source": "نهج البلاغة · حكمة ٢٠٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ حَاسَبَ نَفْسَهُ رَبِحَ، وَمَنْ غَفَلَ عَنْهَا خَسِرَ، وَمَنْ خَافَ أَمِنَ، وَمَنِ اعْتَبَرَ أَبْصَرَ وَمَنْ أَبْصَرَ فَهِمَ وَمَنْ فَهِمَ عَلِمَ."]], "source": "نهج البلاغة · حكمة ٢٠٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَتَعْطِفَنَّ الدُّنْيَا عَلَيْنَا بَعْدَ شِمَاسِهَا عَطْفَ الضَّرُوسِ عَلَى وَلَدِهَا. وَتَلَا عَقِيبَ ذَلِكَ: ﴿وَنُرِيدُ أَن نَّمُنَّ عَلَى الَّذِينَ اسْتُضْعِفُوا فِي الْأَرْضِ وَنَجْعَلَهُمْ أَئِمَّةً وَنَجْعَلَهُمُ الْوَارِثِينَ﴾."]], "source": "نهج البلاغة · حكمة ٢٠٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "اتَّقُوا اللَّهَ تَقِيَّةَ مَنْ شَمَّرَ تَجْرِيداً وَجَدَّ تَشْمِيراً وَكَمَّشَ فِى مَهَلٍ وَبَادَرَ عَنْ وَجَلٍ وَنَظَرَ فِى كَرَّةِ الْمَوْئِلِ وَعَاقِبَةِ الْمَصْدَرِ وَمَغَبَّةِ الْمَرْجِعِ."]], "source": "نهج البلاغة · حكمة ٢١٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عُجْبُ الْمَرْءِ بِنَفْسِهِ أَحَدُ حُسَّادِ عَقْلِهِ."]], "source": "نهج البلاغة · حكمة ٢١٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَغْضِ عَلَى الْقَذَى وَالْأَلَمِ تَرْضَ أَبَداً."]], "source": "نهج البلاغة · حكمة ٢١٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "فِي تَقَلُّبِ الْأَحْوَالِ عِلْمُ جَوَاهِرِ الرِّجَالِ."]], "source": "نهج البلاغة · حكمة ٢١٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَكْثَرُ مَصَارِعِ الْعُقُولِ تَحْتَ بُرُوقِ الْمَطَامِعِ."]], "source": "نهج البلاغة · حكمة ٢١٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَيْسَ مِنَ الْعَدْلِ الْقَضَاءُ عَلَى الثِّقَةِ بِالظَّنِّ."]], "source": "نهج البلاغة · حكمة ٢٢٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "بِئْسَ الزَّادُ إِلَى الْمَعَادِ الْعُدْوَانُ عَلَى الْعِبَادِ."]], "source": "نهج البلاغة · حكمة ٢٢١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مِنْ أَشْرَفِ أَفْعَالِ الْكَرِيمِ غَفْلَتُهُ عَمَّا يَعْلَمُ."]], "source": "نهج البلاغة · حكمة ٢٢٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ كَسَاهُ الْحَيَاءُ ثَوْبَهُ لَمْ يَرَ النَّاسُ عَيْبَهُ."]], "source": "نهج البلاغة · حكمة ٢٢٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "بِكَثْرَةِ الصَّمْتِ تَكُونُ الْهَيْبَةُ وَبِالنَّصَفَةِ يَكْثُرُ الْمُوَاصِلُونَ وَبِالْإِفْضَالِ تَعْظُمُ الْأَقْدَارُ وَبِالتَّوَاضُعِ تَتِمُّ النِّعْمَةُ وَبِاحْتِمَالِ الْمُؤَنِ يَجِبُ السُّؤْدُدُ وَبِالسِّيرَةِ الْعَادِلَةِ يُقْهَرُ الْمُنَاوِئُ وَبِالْحِلْمِ عَنِ السَّفِيهِ تَكْثُرُ الْأَنْصَارُ عَلَيْهِ."]], "source": "نهج البلاغة · حكمة ٢٢٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْعَجَبُ لِغَفْلَةِ الْحُسَّادِ عَنْ سَلاَمَةِ الْأَجْسَادِ."]], "source": "نهج البلاغة · حكمة ٢٢٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كَفَى بِالْقَنَاعَةِ مُلْكاً، وَبِحُسْنِ الْخُلُقِ نَعِيماً. وَسُئِلَ (عليه السلام) عَنْ قَوْلِهِ تَعَالَى ﴿فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً﴾ فَقَالَ: هِيَ الْقَنَاعَةُ."]], "source": "نهج البلاغة · حكمة ٢٢٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "شَارِكُوا الَّذِي قَدْ أَقْبَلَ عَلَيْهِ الرِّزْقُ، فَإِنَّهُ أَخْلَقُ لِلْغِنَى، وَأَجْدَرُ بِإِقْبَالِ الْحَظِّ عَلَيْهِ."]], "source": "نهج البلاغة · حكمة ٢٣٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ يُعْطِ بِالْيَدِ الْقَصِيرَةِ يُعْطَ بِالْيَدِ الطَّوِيلَةِ."]], "source": "نهج البلاغة · حكمة ٢٣٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "خِيَارُ خِصَالِ النِّسَاءِ شِرَارُ خِصَالِ الرِّجَالِ: الزَّهْوُ وَالْجُبْنُ وَالْبُخْلُ، فَإذَا كَانَتِ الْمَرْأَةُ مَزْهُوَّةً لَمْ تُمَكِّنْ مِنْ نَفْسِهَا، وَإِذَا كَانَتْ بِخِيلَةً حَفِظَتْ مَالَهَا وَمَالَ بَعْلِهَا، وَإِذَا كَانَتْ جَبَانَةً فَرِقَتْ مِنْ كُلِّ شِيْءٍ يَعْرِضُ لَهَا."]], "source": "نهج البلاغة · حكمة ٢٣٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "صِفْ لَنَا الْعَاقِلَ. فَقَالَ (عليه السلام): هُوَ الِّذِي يَضَعُ الشَّيْءَ مَوَاضِعَهُ. فَقِيلَ: فَصِفْ لَنَا الْجَاهِلَ. فَقَالَ: قَدْ فَعَلْتُ."]], "source": "نهج البلاغة · حكمة ٢٣٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "وَاللهِ لَدُنْيَاكُمْ هذِهِ أَهْوَنُ فِي عَيْنِي مِنْ عِرَاقِ خِنْزِيرٍ فِي يَدِ مَجْذُومٍ."]], "source": "نهج البلاغة · حكمة ٢٣٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ قَوْماً عَبَدُوا اللهَ رَغْبَةً فَتِلْكَ عِبَادَةُ التُّجَّارِ، وَإِنَّ قَوْماً عَبَدُوا اللهَ رَهْبَةً فَتِلْكَ عِبَادَةُ الْعَبِيدِ، وَإِنَّ قَوْماً عَبَدُوا اللهَ شُكْراً فَتِلْكَ عِبَادَةُ الْأَحْرَارِ."]], "source": "نهج البلاغة · حكمة ٢٣٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْمَرْأَةُ شَرٌّ كُلُّهَا، وَشَرُّ مَا فِيهَا أَنَّهُ لَا بُدَّ مِنْهَا."]], "source": "نهج البلاغة · حكمة ٢٣٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ أَطَاعَ التَّوَانِيَ ضَيَّعَ الْحُقُوقَ، وَمَنْ أَطَاعَ الْوَاشِيَ ضَيَّعَ الصَّدِيقَ."]], "source": "نهج البلاغة · حكمة ٢٣٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْحَجَرُ الْغَصِيبُ فِي الدَّارِ رَهْنٌ عَلَى خَرَابِهَا."]], "source": "نهج البلاغة · حكمة ٢٤٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَوْمُ الْمَظْلُومِ عَلَى الظَّالِمِ أَشدُّ مِنْ يَوْمِ الظَّالِمِ عَلَى الْمَظْلُومِ."]], "source": "نهج البلاغة · حكمة ٢٤١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "اتَّقِ اللهَ بَعْضَ التُّقَى وَإِنْ قَلَّ، وَاجْعَلْ بَيْنَكَ وَبَيْنَ اللهِ سِتْراً وَإِنْ رَقَّ."]], "source": "نهج البلاغة · حكمة ٢٤٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ لله فِي كُلِّ نِعْمَةٍ حَقّاً، فَمَنْ أَدَّاهُ زَادَهُ مِنْهَا، وَمَنْ قَصَّرَ مِنْهُ خَاطَرَ بِزَوَالِ نِعْمَتِهِ."]], "source": "نهج البلاغة · حكمة ٢٤٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "احْذَرُوا نِفَارَ النِّعَمِ فَمَا كُلُّ شَارِدٍ بِمَرْدُودٍ."]], "source": "نهج البلاغة · حكمة ٢٤٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ ظَنَّ بِكَ خَيْراً فَصَدِّقْ ظَنَّهُ."]], "source": "نهج البلاغة · حكمة ٢٤٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَفْضَلُ الْأَعْمَالِ مَا أَكْرَهْتَ نَفْسَكَ عَلَيْهِ."]], "source": "نهج البلاغة · حكمة ٢٤٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "عَرَفْتُ اللهَ سُبْحَانَهُ بِفَسْخِ الْعَزَائِمِ وَحَلِّ الْعُقُودِ."]], "source": "نهج البلاغة · حكمة ٢٥٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَرَارَةُ الدُّنْيَا حَلاَوَةُ الْآخِرَةِ، وَحَلاَوَةُ الدُّنْيَا مَرَارَةُ الْآخِرَةِ."]], "source": "نهج البلاغة · حكمة ٢٥١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَا ابْنَ آدَمَ كُنْ وَصِيَّ نَفْسِكَ فِى مَالِكَ وَاعْمَلْ فِيهِ مَا تُؤْثِرُ أَنْ يُعْمَلَ فِيهِ مِنْ بَعْدِكَ."]], "source": "نهج البلاغة · حكمة ٢٥٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْحِدَّةُ ضَرْبٌ مِنَ الْجُنُونِ، لاِنَّ صَاحِبَهَا يَنْدَمُ، فَإِنْ لَمْ يَنْدَمْ فَجُنُونُهُ مُسْتَحْكِمٌ."]], "source": "نهج البلاغة · حكمة ٢٥٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْوَفَاءُ لِأَهْلِ الْغَدْرِ غَدْرٌ عِنْدَ اللهِ، وَالْغَدْرُ بَأَهْلِ الْغَدْرِ وَفَاءٌ عِنْدَ اللهِ."]], "source": "نهج البلاغة · حكمة ٢٥٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كَمْ مِنْ مُسْتَدْرَجٍ بِالْإِحْسَانِ إِلَيْهِ، وَمَغْرُورٍ بِالسَّتْرِ عَلَيْهِ، وَمَفْتُونٍ بِحُسْنِ الْقَوْلِ فِيهِ، وَمَا ابْتَلَى اللهُ سُبْحَانَهُ أَحَداً بِمِثْلِ الْإِمْلَاءِ لَهُ."]], "source": "نهج البلاغة · حكمة ٢٦٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "صَاحِبُ السُّلْطَانِ كَرَاكِبِ الْأَسَدِ : يُغْبَطُ بِمَوْقِعِهِ، وَهُوَ أَعْلَمُ بِمَوْضِعِهِ."]], "source": "نهج البلاغة · حكمة ٢٦٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَحْسِنُوا فِي عَقِبِ غَيْرِكُمْ تُحْفَظُوا فِي عَقِبِكُمْ."]], "source": "نهج البلاغة · حكمة ٢٦٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ كَلاَمَ الْحُكَمَاءِ إذَا كَانَ صَوَاباً كَانَ دَوَاءً، وَإِذَا كَانَ خَطَأً كَانَ دَاءً."]], "source": "نهج البلاغة · حكمة ٢٦٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَابْنَ آدَمَ، لَا تَحْمِلْ هَمَّ يَوْمِكَ الَّذِي لَمْ يَأْتِكَ عَلَى يَوْمِكَ الَّذِي قَدْ أَتَاكَ، فَإِنَّهُ إِنْ يَكُ مِنْ عُمُرِكَ يَأْتِ اللهُ فِيهِ بِرِزْقِكَ."]], "source": "نهج البلاغة · حكمة ٢٦٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَحْبِبْ حَبِيبَكَ هَوْناً مَا عَسَى أَنْ يَكُونَ بَغِيضَكَ يَوْماً مَا، وَأَبْغِضْ بَغِيضَكَ هَوْناً مَا عَسَى أَنْ يَكُونَ حَبِيبَكَ يَوْماً مَا."]], "source": "نهج البلاغة · حكمة ٢٦٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَوْ قَدِ اسْتَوَتْ قَدَمَايَ مِنْ هذِهِ الْمَدَاحِضِ لَغَيَّرْتُ أَشْيَاءَ."]], "source": "نهج البلاغة · حكمة ٢٧٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا تَجْعَلُوا عِلْمَكُمْ جَهْلًا وَيَقِينَكُمْ شَكّاً إِذَا عَلِمْتُمْ فَاعْمَلُوا وَإِذَا تَيَقَّنْتُمْ فَأَقْدِمُوا."]], "source": "نهج البلاغة · حكمة ٢٧٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ الطَّمَعَ مُورِدٌ غَيْرُ مُصْدِرٍ وَضَامِنٌ غَيْرُ وَفِيٍّ وَرُبَّمَا شَرِقَ شَارِبُ الْمَاءِ قَبْلَ رِيِّهِ وَكُلَّمَا عَظُمَ قَدْرُ الشَّيْ‏ءِ الْمُتَنَافَسِ فِيهِ عَظُمَتِ الرَّزِيَّةُ لِفَقْدِهِ وَالْأَمَانِيُّ تُعْمِى أَعْيُنَ الْبَصَائِرِ وَالْحَظُّ يَأْتِى مَنْ لَا يَأْتِيهِ."]], "source": "نهج البلاغة · حكمة ٢٧٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "اللَّهُمَّ إِنِّى أَعُوذُ بِكَ مِنْ أَنْ تُحَسِّنَ فِى لَامِعَةِ الْعُيُونِ عَلَانِيَتِي وَتُقَبِّحَ فِيمَا أُبْطِنُ لَكَ سَرِيرَتِى مُحَافِظاً عَلَى رِثَاءِ النَّاسِ مِنْ نَفْسِى بِجَمِيعِ مَا أَنْتَ مُطَّلِعٌ عَلَيْهِ مِنِّى فَأُبْدِيَ لِلنَّاسِ حُسْنَ ظَاهِرِى وَأُفْضِيَ إِلَيْكَ بِسُوءِ عَمَلِى تَقَرُّباً إِلَى عِبَادِكَ وَتَبَاعُداً مِنْ مَرْضَاتِكَ."]], "source": "نهج البلاغة · حكمة ٢٧٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا وَالَّذِي أَمْسَيْنَا مِنْهُ فِي غُبْرِ لَيْلَةٍ دَهْمَاءَ تَكْشِرُعَنْ يَوْمٍ أَغَرَّ مَا كَان كَذَا وَكَذَا."]], "source": "نهج البلاغة · حكمة ٢٧٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "قَلِيلٌ تَدُومُ عَ م"], ["q", "لَا يَصْدُقُ إِيمَانُ عَبْدٍ، حَتّى يَكُونَ بِمَا فِي يَدِ اللهِ سُبْحَانَهُ أَوْثَقَ مِنهُ بِمَا فِي يَدِهِ."]], "source": "نهج البلاغة · حكمة ٣١٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ لِلْقُلُوبِ إِقْبَالًا وَإِدْبَاراً فَإِذَا أَقْبَلَتْ فَاحْمِلُوهَا عَلَى النَّوَافِلِ، وَإذَا أَدْبَرَتْ فَاقْتَصِرُوا بِهَا عَلَى الْفَرَائِضِ."]], "source": "نهج البلاغة · حكمة ٣١٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "وَفِي الْقرْآنِ نَبَأُ مَا قَبْلَكُمْ، وَخَبَرُ مَا بَعْدَكُمْ، وَحُكْمُ مَا بَيْنَكُمْ."]], "source": "نهج البلاغة · حكمة ٣١٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "رُدُّوا الْحَجَرَمِنْ حَيْثُ جَاءَ، فَإِنَّ الشَّرَّ لَا يَدْفَعُهُ إِلَّا الشَّرُّ."]], "source": "نهج البلاغة · حكمة ٣١٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَنا يَعْسُوبُ الْمُؤْمِنِينَ، وَالْمَالُ يَعْسُوبُ الْفُجَّارِ."]], "source": "نهج البلاغة · حكمة ٣١٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "بِأَيِّ شَيْ‏ءٍ غَلَبْتَ الْأَقْرَانَ، فَقَالَ (عليه السلام): مَا لَقِيتُ رَجُلًا إِلَّا أَعَانَنِى عَلَى نَفْسِهِ."]], "source": "نهج البلاغة · حكمة ٣١٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "اتَّقُوا مَعَاصِيَ اللهِ فِي الْخَلَوَاتِ، فَإِنَّ الشَّاهِدَ هُوَ الْحَاكِمُ."]], "source": "نهج البلاغة · حكمة ٣٢٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الدَّاعِي بِلاَ عَمَلٍ كَالرَّامِي بِلاَ وَتَرٍ."]], "source": "نهج البلاغة · حكمة ٣٣٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْعِلْمُ عِلْمَانِ: مَطْبُوعٌ وَمَسْمُوعٌ وَلَا يَنْفَعُ الْمَسْمُوعُ إِذَا لَمْ يَكُنِ الْمَطْبُوعُ."]], "source": "نهج البلاغة · حكمة ٣٣٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "صَوَابُ الرَّأْيِ بِالدُّوَلِ: يُقْبِلُ بِإِقْبَالِهَا وَيَذْهَبُ بِذَهَابِهَا."]], "source": "نهج البلاغة · حكمة ٣٣٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْعَفَافُ زِينَةُ الْفَقْرِ، وَالشُّكْرُ زِينَةُ الْغِنَى."]], "source": "نهج البلاغة · حكمة ٣٤٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَوْمُ الْعَدْلِ عَلَى الظَّالِمِ أَشَدُّ مِنْ يَومِ الْجَوْرِ عَلَى الْمَظْلُومِ!"]], "source": "نهج البلاغة · حكمة ٣٤١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْغِنَى الْأَكْبَرُ الْيَأْسُ عَمَّا فِي أَيْدِى النَّاسِ."]], "source": "نهج البلاغة · حكمة ٣٤٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْأَقَاوِيلُ مَحْفُوظَةٌ وَالسَّرَائِرُ مَبْلُوَّةٌ وَ﴿كُلُّ نَفْسٍ بِمَا كَسَبَتْ رَهِينَةٌ﴾ وَالنَّاسُ مَنْقُوصُونَ مَدْخُولُونَ إِلَّا مَنْ عَصَمَ اللَّهُ: سَائِلُهُمْ مُتَعَنِّتٌ وَمُجِيبُهُمْ مُتَكَلِّفٌ يَكَادُ أَفْضَلُهُمْ رَأْياً يَرُدُّهُ عَنْ فَضْلِ رَأْيِهِ الرِّضَى وَالسُّخْطُ، وَيَكَادُ أَصْلَبُهُمْ عُوداً تَنْكَؤُهُ اللَّحْظَةُ وَتَسْتَحِيلُهُ الْكَلِمَةُ الْوَاحِدَةُ."]], "source": "نهج البلاغة · حكمة ٣٤٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَاءُ وَجْهِكَ جَامِدٌ يُقْطِرُهُ السُّؤَالُ، فَانْظُرْ عِنْدَ مَنْ تُقْطِرُهُ."]], "source": "نهج البلاغة · حكمة ٣٤٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الثَّنَاءُ بِأَكْثَرَ مِنَ الِاسْتِحْقَاقِ مَلَقٌ وَالتَّقْصِيرُ عَنِ الِاسْتِحْقَاقِ عِيٌّ أَوْ حَسَدٌ."]], "source": "نهج البلاغة · حكمة ٣٤٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَشدُّ الذُّنُوبِ مَا اسْتَهَانَ بِهِ صَاحِبُهُ."]], "source": "نهج البلاغة · حكمة ٣٤٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ نَظَرَ فِي عَيْبِ نَفْسِهِ اشْتَغَلَ عَنْ عَيْبِ غَيْرهِ، وَمَنْ رَضِيَ برِزْقِ اللهِ لَمْ يَحْزَنْ عَلَى مَا فَاتَهُ، وَمَنْ سَلَّ سَيْفَ الْبَغْيِ قُتِلَ بِهِ، وَمَنْ كَابَدَ الْأُمُورَ عَطِبَ، وَمَنِ اقْتَحَمَ اللُّجَجَ غَرِقَ، وَمَنْ دَخَلَ مَدَاخِلَ السُّوءِ اتُّهِمَ،"]], "source": "نهج البلاغة · حكمة ٣٤٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لِلظَّالِمِ مِنَ الرِّجَالِ ثَلاَثُ عَلاَمَاتٍ: يَظْلِمُ مَنْ فَوْقَهُ بِالْمَعْصِيَةِ، وَمَنْ دُونَهُ بِالْغَلَبَةِ وَيُظَاهِرُ الْقَوْمَ الظَّلَمَةَ."]], "source": "نهج البلاغة · حكمة ٣٥٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِذَا كَانَتْ لَكَ إِلَى اللهِ سُبْحَانَهُ حَاجَةٌ فَابْدَأْ بِمَسْأَلَةِ الصَّلاَةِ عَلَى رَسُولِهِ (صلى الله عليه وآله)، ثُمَّ سَلْ حَاجَتَكَ، فَإِنَّ اللهَ أَكْرَمُ مِنْ أَنْ يُسْأَلَ حَاجَتَيْنِ فَيَقْضِيَ إِحْدَاهُمَا وَيَمْنَعَ الْأُخْرَى."]], "source": "نهج البلاغة · حكمة ٣٦١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مِنَ الْخُرْقِ الْمُعَاجَلَةُ قَبْلَ الْإِمْكَانِ، وَالْأَنَاةُ بَعْدَ الْفُرْصَةِ."]], "source": "نهج البلاغة · حكمة ٣٦٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا تَسْأَلْ عَمَّا لَا يَكُونُ، فَفِي الَّذِي قَدْ كَانَ لَكَ شُغُلٌ."]], "source": "نهج البلاغة · حكمة ٣٦٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْفِكْرُ مرْآةٌ صَافِيَةٌ، وَالِاعْتِبَارُ مُنْذِرٌ نَاصِحٌ، وَكَفَى أَدَباً لِنَفْسِكَ تَجَنُّبُكَ مَا كَرِهْتَهُ لِغَيْرِكَ."]], "source": "نهج البلاغة · حكمة ٣٦٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْعِلْمُ مَقْرُونٌ بِالْعَمَلِ فَمَنْ عَلِمَ عَمِلَ، وَالْعِلْمُ يَهْتِفُ بِالْعَمَلِ فَإِنْ أَجَابَهُ وَإِلَّا ارْتَحَلَ عَنْهُ."]], "source": "نهج البلاغة · حكمة ٣٦٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا خَيْرٌ بِخَيْرٍ بَعْدَهُ النَّارُ، وَمَا شَرٌّ بِشَرٍّ بَعْدَهُ الْجَنَّةُ، وَكُلُّ نَعِيمٍ دُونَ الْجَنَّةِ فَهُوَ مَحْقُورٌ وَكُلُّ بَلاَءٍ دُونَ النَّارِ عَافِيَةٌ."]], "source": "نهج البلاغة · حكمة ٣٨٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا أَحْسَنَ تَوَاضُعَ الْأَغْنِيَاءِ لِلْفُقَرَاءِ طَلَباً لِمَا عِنْدَ اللهِ! وأَحْسَنُ مِنْهُ تِيهُ الْفُقَرَاءِ عَلَى الْأَغْنِيَاءِ اتِّكَالًا عَلَى الله."]], "source": "نهج البلاغة · حكمة ٤٠٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا اسْتَوْدَعَ اللهُ امْرَأً عَقْلاً إِلَّا اسْتَنْقَذَهُ بِهِ يَوْماً مَا."]], "source": "نهج البلاغة · حكمة ٤٠٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا تَجْعَلَنَّ ذَرَبَ لِسَانِكَ عَلَى مَنْ أَنْطَقَكَ، وَبَلاَغَةَ قَوْلِكَ عَلَى مَنْ سَدَّدَكَ."]], "source": "نهج البلاغة · حكمة ٤١١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كَفَاكَ أَدَباً لِنَفْسِكَ اجْتِنَابُ مَا تَكْرَهُهُ مِنْ غَيْرِكَ."]], "source": "نهج البلاغة · حكمة ٤١٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ صَبَرَ صَبْرَ الْأَحْرَارِ، وَإِلَّا سَلاَ سُلُوَّ الْأَغْمَارِ."]], "source": "نهج البلاغة · حكمة ٤١٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مِسْكِينٌ ابْنُ آدَمَ: مَكْتُومُ الْأَجَلِ، مَكْنُونُ الْعِلَلِ، مَحْفُوظُ الْعَمَلِ، تَؤْلِمُهُ الْبَقَّةُ، وَتَقْتُلُهُ الشَّرْقَةُ وَتُنْتِنُهُ الْعَرْقَةُ."]], "source": "نهج البلاغة · حكمة ٤١٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "كَفَاكَ مِنْ عَقْلِكَ مَا أَوْضَحَ لَكَ سَبِيلَ غَيِّكَ مِنْ رُشْدِكَ."]], "source": "نهج البلاغة · حكمة ٤٢١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "افْعَلُوا الْخَيْرَ وَلَا تَحْقِرُوا مِنْهُ شَيْئاً، فَإِنَّ صَغِيرَهُ كَبِيرٌ وَقَلِيلَهُ كَثِيرٌ، وَلَا يَقُولَنَّ أَحَدُكُمْ: إِنَّ أَحَداً أَوْلَى بِفِعْلِ الْخَيْرِ مِنِّي فَيَكُونَ وَاللهِ كَذلِكَ، إِنَّ لِلْخَيْرِ وَالشَّرِّ أَهْلاً، فَمَهْمَا تَرَكْتُمُوهُ مِنْهُمَا كَفَاكُمُوهُ أَهْلُهُ."]], "source": "نهج البلاغة · حكمة ٤٢٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ أَصْلَحَ سَرِيرَتَهُ أَصْلَحَ اللهُ عَلاَنِيَتَهُ، وَمَنْ عَمِلَ لِدِينِهِ كَفَاهُ اللهُ أَمْرَ دُنْيَاهُ، وَمَنْ أَحْسَنَ فِيَما بَيْنَهُ وبَيْنَ اللهِ، أَحْسَنَ اللَّهُ مَا بَيْنَهُ وَبَيْنَ النَّاسِ."]], "source": "نهج البلاغة · حكمة ٤٢٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْحِلْمُ غِطَاءٌ سَاتِرٌ، وَالْعَقْلُ حُسَامٌ قَاطِعٌ، فَاسْتُرْ خَلَلَ خُلُقِكَ بِحِلْمِكَ، وَقَاتِلْ هَوَاكَ بِعَقْلِكَ."]], "source": "نهج البلاغة · حكمة ٤٢٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ لِلَّهِ عِبَاداً يَخْتَصُّهُمُ اللَّهُ بِالنِّعَمِ لِمَنَافِعِ الْعِبَادِ، فَيُقِرُّهَا فِي أَيْدِيهِمْ مَا بَذَلُوهَا، فَإِذَا مَنَعُوهَا نَزَعَهَا مِنْهُمْ، ثُمَّ حَوَّلَهَا إِلَى غَيْرِهِمْ."]], "source": "نهج البلاغة · حكمة ٤٢٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا يَنْبَغِي لِلْعَبْدِ أَنْ يَثِقَ بِخَصْلَتَيْنِ: الْعَافِيَةِ، وَالْغِنَى: بَيْنَا تَرَاهُ مُعَافًى إِذْ سَقِمَ، وَبَيْنَا تَرَاهُ غَنِيّاً إِذِ افْتَقَرَ."]], "source": "نهج البلاغة · حكمة ٤٢٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ شَكَا الْحَاجَةَ إِلَى مُؤْمِنٍ فَكَأَنَّمَا شَكَاهَا إِلَى اللهِ، وَمَنْ شَكَاهَا إلَى كَافِرٍ فَكَأَنَّمَا شَكَا اللهَ."]], "source": "نهج البلاغة · حكمة ٤٢٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ أَعْظَمَ الْحَسَرَاتِ يَوْمَ الْقِيَامَةِ حَسْرَةُ رَجُلٍ كَسَبَ مَالًا فِي غَيْرِ طَاعَةِ اللهِ، فَوَرَّثَهُ رَجُلٌ فَأنْفَقَهُ فِي طَاعَةِ اللهِ سُبْحَانَهُ، فَدَخَلَ بِهِ الْجَنَّةَ، وَدَخَلَ الْأَوَّلُ بِهِ النَّارَ."]], "source": "نهج البلاغة · حكمة ٤٢٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ أَخْسَرَ النَّاسِ صَفْقَةً وَأَخْيَبَهُمْ سَعْياً، رَجُلٌ أَخْلَقَ بَدَنَهُ فِي طَلَبِ آمَالِهِ، وَلَمْ تُسَاعِدْهُ الْمَقَادِيرُ عَلَى إِرَادَتِهِ، فَخَرَجَ مِنَ الدُّنْيَا بِحَسْرَتِهِ، وَقَدِمَ عَلَى الْآخِرَةِ بِتَبِعَتِهِ."]], "source": "نهج البلاغة · حكمة ٤٣٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الرِّزْقُ رِزْقَانِ: طَالِبٌ، وَمَطْلُوبٌ، فَمَنْ طَلَبَ الدُّنْيَا طَلَبَهُ الْمَوْتُ حَتَّى يُخْرِجَهُ عَنْهَا، وَمَنْ طَلَبَ الْآخِرَةَ طَلَبَتْهُ الدُّنْيَا حَتَّى يَسْتَوْفِيَ رِزْقَهُ مِنْهَا."]], "source": "نهج البلاغة · حكمة ٤٣١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا كَانَ اللهُ لِيَفْتَحَ عَلَى عَبْدٍ بَابَ الشُّكْرِ وَيُغْلِقَ عَنْهُ بَابَ الزِّيَادَةِ، وَلَا لِيَفْتَحَ عَلَى عَبْدٍ بَابَ الدُّعَاءِ وَيُغْلِقَ عَنْهُ بَابَ الْإِجَابَةِ، وَلَا لِيَفْتَحَ لِعَبْدٍ بَابَ التَّوْبَةِ وَيُغْلِقَ عَنْهُ بَابَ الْمَغْفِرَةِ."]], "source": "نهج البلاغة · حكمة ٤٣٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أوْلَى النَّاسِ بِالْكَرَمِ مَنْ عَرَقتْ فيه الْكِرَامُ."]], "source": "نهج البلاغة · حكمة ٤٣٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَيْسَ بَلَدٌ بأَحَقَّ بِكَ مِنْ بَلَدٍ، خَيْرُ الْبِلاَدِ مَا حَمَلَكَ."]], "source": "نهج البلاغة · حكمة ٤٤٢"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "قَلِيلٌ مَدُومٌ عَلَيْهِ خَيْرٌ مِنْ كَثِيرٍ مَمْلُولٍ مِنْهُ."]], "source": "نهج البلاغة · حكمة ٤٤٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إذَا كَانَ في رَجُلٍ خَلَّةٌ رَائِعَةٌ فَانْتَظِرُوا أَخَوَاتِهَا."]], "source": "نهج البلاغة · حكمة ٤٤٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنِ اتَّجَرَ بِغَيْرِ فِقْهٍ فَقَدِ ارْتَطَمَ فِي الرِّبَا."]], "source": "نهج البلاغة · حكمة ٤٤٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ عَظَّمَ صِغَارَ الْمَصَائِبِ ابْتَلاَهُ اللهُ بِكِبَارِهَا."]], "source": "نهج البلاغة · حكمة ٤٤٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ كَرُمَتْ عَلَيْهِ نَفْسُهُ هَانَتْ عَلَيْهِ شَهْوَتُهُ."]], "source": "نهج البلاغة · حكمة ٤٤٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "زُهْدُكَ فِي رَاغِبٍ فِيكَ نُقْصَانُ حَظٍّ، وَرَغْبَتُكَ فِي زَاهِدٍ فِيكَ ذُلُّ نَفْسٍ."]], "source": "نهج البلاغة · حكمة ٤٥١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا زَالَ الزُّبَيْرُ رَجُلاً مِنَّا أَهْلَ الْبَيْتِ حَتَّى نَشَأَ ابْنُهُ الْمَشْؤُومُ عَبْدُ اللهِ."]], "source": "نهج البلاغة · حكمة ٤٥٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا لِابْنِ آدَمَ وَالْفَخْرِ: أَوَّلُهُ نُطْفَةٌ، وَآخِرُهُ جِيفَةٌ، وَلَا يَرْزُقُ نَفْسَهُ، وَلَا يَدفَعُ حَتْفَهُ."]], "source": "نهج البلاغة · حكمة ٤٥٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْ أَشْعَرُ الشُّعَرَاءِ؟ فقال (عليه السلام) :"]], "source": "نهج البلاغة · حكمة ٤٥٥"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَلَا حُرٌّ يَدَعُ هذِهِ اللُّمَاظَةَ لِأَهْلِهَا؟ إِنَّهُ لَيْسَ لِأَنْفُسِكُمْ ثَمَنٌ إِلَّا الْجَنَّةَ، فَلاَ تَبِيعُوهَا إِلَّا بِهَا."]], "source": "نهج البلاغة · حكمة ٤٥٦"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَنْهُومَانِ لَا يَشْبَعَانِ: طَالِبُ عِلْمٍ، وَطَالِبُ دُنْيَا."]], "source": "نهج البلاغة · حكمة ٤٥٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "(عَلَامَةُ) الْإِيمَانُ أَنْ تُؤثِرَ الصِّدْقَ حَيْثُ يَضُرُّكَ عَلَى الْكَذِبِ حَيْثُ يَنْفَعُكَ، وَأَلَّا يَكُونَ فِي حَديِثِكَ فَضْلٌ عَنْ عِلْمِكَ وَأَنْ تَتَّقِيَ اللهَ فِي حَدِيثِ غَيْرِكَ."]], "source": "نهج البلاغة · حكمة ٤٥٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَغْلِبُ الْمِقْدَارُعَلَى التَّقْديرِ حَتَّى تَكُونَ الْآفَةُ فِي التَّدْبِيرِ."]], "source": "نهج البلاغة · حكمة ٤٥٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الْحِلْمُ وَالْأَنَاةُ تَوْأَمَانِ يُنْتِجُهُمَا عُلُوُّ الْهِمَّةِ."]], "source": "نهج البلاغة · حكمة ٤٦٠"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "الدُّنْيَا خُلِقَتْ لِغَيْرِهَا، ولَمْ تُخْلَقْ لِنَفْسِهَا."]], "source": "نهج البلاغة · حكمة ٤٦٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِنَّ لِبَنِي أُمَيَّةَ مِرْوَدَاً يَجْرُونَ فِيهِ، وَلَوْ قَدِ اخْتَلَفُوا فِيَما بَيْنَهُمْ ثُمَّ كَادَتْهُمُ الضِّبَاعُ لَغَلَبَتْهُمْ."]], "source": "نهج البلاغة · حكمة ٤٦٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَأْتِي عَلَى النَّاسِ زَمَانٌ عَضُوضٌ يَعَضُّ الْمُوسِرُ فِيهِ عَلَى مَا فِي يَدَيْهِ وَلَمْ يُؤْمَرْ بِذلِكَ، قَالَ اللهُ سُبْحَانَهُ: ﴿وَلَا تَنسَوُا الْفَضْلَ بَيْنَكُمْ﴾، تَنْهَدُ فِيهِ الْأَشْرَارُ، وَتُسْتَذَلُّ الْأَخْيَارُ، ويُبَايعُ الْمُضْطَرُّونَ، وَقَدْ نَهَى رَسُولُ اللهِ (صَلى اللهُ عليه و آله و سلم) عَنْ بِيَعِ الْمُضْطَرِّينَ."]], "source": "نهج البلاغة · حكمة ٤٦٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "يَهْلِكُ فِيَّ رَجُلاَنِ: مُحِبٌّ مُفْرِطٌ، وَبَاهِتٌ مُفْتَرٍ."]], "source": "نهج البلاغة · حكمة ٤٦٩"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَا خَيْرَ فِي الصَّمْتِ عَنِ الْحُكْمِ، كَمَا أنَّهُ لَا خَيْرَ فِي الْقَوْلِ بِالْجَهْلِ."]], "source": "نهج البلاغة · حكمة ٤٧١"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "لَوْ غَيَّرْتَ شَيْبَكَ يَا أَمِيرَ الْمُؤْمِنِينَ. فَقَالَ (عليه السلام) :"]], "source": "نهج البلاغة · حكمة ٤٧٣"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا الْـمُجَاهِدُ الشَّهِيدُ فِي سَبِيلِ اللهِ بِأَعْظَمَ أَجْراً مِمَّنْ قَدَرَ فَعَفَّ، لَكَادَ الْعَفِيفُ أَنْ يَكُونَ مَلَكاً مِنَ الْمَلاَئِكَةِ."]], "source": "نهج البلاغة · حكمة ٤٧٤"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "أَشَدُّ الذُّنُوبِ مَا اسْتَخَفَّ بِهِ صَاحِبُهُ."]], "source": "نهج البلاغة · حكمة ٤٧٧"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "مَا أَخَذَ اللهُ عَلَى أَهْلِ الْجَهْلِ أَنْ يَتَعَلَّمُوا حَتَّى أَخَذَ عَلَى أَهْلِ الْعِلْمِ أَنْ يُعَلِّمُوا."]], "source": "نهج البلاغة · حكمة ٤٧٨"}, {"parts": [["n", "قال أمير المؤمنين عليه السلام"], ["q", "إِذَا احْتَشَمَ الْمُؤْمِنُ أَخَاهُ فَقَدْ فَارَقَهُ."]], "source": "نهج البلاغة · حكمة ٤٨٠"}, {"parts": [["n", "عن الإمام الصادق عليه السلام"], ["q", "اطْلُبُوا الْعِلْمَ وَتَزَيَّنُوا مَعَهُ بِالْحِلْمِ وَالْوَقَارِ وَتَوَاضَعُوا لِمَنْ تُعَلِّمُونَهُ الْعِلْمَ وَتَوَاضَعُوا لِمَنْ طَلَبْتُمْ مِنْهُ الْعِلْمَ وَلا تَكُونُوا عُلَمَاءَ جَبَّارِينَ فَيَذْهَبَ بَاطِلُكُمْ بِحَقِّكُمْ."]], "source": "الكافي · ١/٢/٥/١ · صحيح (المجلسي)"}, {"parts": [["n", "عن الإمام الصادق عليه السلام"], ["q", "مَا مِنْ أَحَدٍ يَمُوتُ مِنَ الْمُؤْمِنِينَ أَحَبَّ إِلَى إِبْلِيسَ مِنْ مَوْتِ فَقِيهٍ."]], "source": "الكافي · ١/٢/٧/١ · موثق (المجلسي)"}, {"parts": [["n", "عن الإمام الصادق عليه السلام"], ["q", "إِذَا مَاتَ الْمُؤْمِنُ الْفَقِيهُ ثُلِمَ فِي الاسْلامِ ثُلْمَةٌ لا يَسُدُّهَا شَيْ‏ءٌ."]], "source": "الكافي · ١/٢/٧/٢ · حسن (المجلسي)"}, {"parts": [["n", "عن الإمام الصادق عليه السلام"], ["q", "مَا مِنْ أَحَدٍ يَمُوتُ مِنَ الْمُؤْمِنِينَ أَحَبَّ إِلَى إِبْلِيسَ مِنْ مَوْتِ فَقِيهٍ."]], "source": "الكافي · ١/٢/٧/٤ · صحيح (المجلسي)"}, {"parts": [["n", "عن الإمام الصادق عليه السلام"], ["q", "إِذَا بَلَغَتِ النَّفْسُ هَاهُنَا وَأَشَارَ بِيَدِهِ إِلَى
